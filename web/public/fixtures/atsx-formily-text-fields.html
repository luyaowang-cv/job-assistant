<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATSX Formily 文本字段测试</title>
    <style>
      body { max-width: 720px; margin: 32px auto; padding: 0 16px; font: 16px/1.5 system-ui, sans-serif; color: #0f172a; }
      form { display: grid; gap: 18px; padding: 28px; border: 1px solid #cbd5e1; border-radius: 12px; }
      .ud-formily-item { display: grid; gap: 8px; }
      .ud-formily-item-label { font-weight: 600; }
      input { box-sizing: border-box; width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid #94a3b8; border-radius: 6px; font: inherit; }
      .ud__select__selector { display: flex; align-items: center; min-height: 40px; padding: 0 10px; border: 1px solid #94a3b8; border-radius: 6px; }
    </style>
  </head>
  <body>
    <h1>ATSX / Formily 文本字段（本地测试）</h1>
    <p>预期：由 Formily 字段元数据识别的文本字段可填写；所有自定义下拉、上传与协议均保持人工处理。</p>
    <form>
      <div class="ud-formily-item" data-form-field-id="name" data-form-field-name="name" data-form-field-i18n-name="姓名"><div class="ud-formily-item-label"><label>姓名</label></div><input class="ud__native-input" /></div>
      <div class="ud-formily-item" data-form-field-id="mobile" data-form-field-name="mobile" data-form-field-i18n-name="手机号码"><div class="ud-formily-item-label"><label>手机号码</label></div><input class="ud__native-input" /></div>
      <div class="ud-formily-item" data-form-field-id="email" data-form-field-name="email" data-form-field-i18n-name="邮箱"><div class="ud-formily-item-label"><label>邮箱</label></div><input class="ud__native-input" /></div>
      <div class="ud-formily-item" data-form-field-id="identification" data-form-field-name="identification" data-form-field-i18n-name="个人证件"><div class="ud-formily-item-label"><label>个人证件</label></div><input class="ud__native-input" /></div>
      <div class="ud-formily-item" data-form-field-id="school" data-form-field-name="school" data-form-field-i18n-name="学校名称"><div class="ud-formily-item-label"><label>学校名称</label></div><input class="ud__native-input" /></div>
      <div class="ud-formily-item" data-form-field-id="field_of_study" data-form-field-name="field_of_study" data-form-field-i18n-name="专业"><div class="ud-formily-item-label"><label>专业</label></div><input class="ud__native-input" /></div>
      <div class="ud-formily-item" data-form-field-id="education_type" data-form-field-name="education_type" data-form-field-i18n-name="学历类型"><div class="ud-formily-item-label"><label>学历类型</label></div><div class="ud__select"><div class="ud__select__selector"><input class="ud__select__selector__search__input ud__native-input" role="combobox" type="search" readonly /></div></div></div>
      <div class="ud-formily-item" data-form-field-i18n-name="简历"><div class="ud-formily-item-label"><label>简历</label></div><input type="file" /></div>
      <label><input type="checkbox" /> 我已阅读并同意隐私政策</label>
    </form>
  </body>
</html>
