# 生产部署编排：Postgres + 迁移 + 初始化所有者账号 + Web 服务
# 用法：在项目根目录创建 .env（填密钥，见下方变量），然后执行
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: job-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: job_assistant
      POSTGRES_USER: job_assistant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_assistant -d job_assistant"]
      interval: 5s
      timeout: 3s
      retries: 12
    # 不对外暴露 5432，只在 Docker 内网供应用访问

  migrate:
    build:
      context: ./web
      target: build-stage
    command: sh -c "pnpm prisma migrate deploy"
    environment:
      DATABASE_URL: postgresql://job_assistant:${POSTGRES_PASSWORD}@db:5432/job_assistant?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  bootstrap:
    build:
      context: ./web
      target: build-stage
    command: sh -c "pnpm auth:bootstrap"
    environment:
      DATABASE_URL: postgresql://job_assistant:${POSTGRES_PASSWORD}@db:5432/job_assistant?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      OWNER_EMAIL: ${OWNER_EMAIL:?请在 .env 设置 OWNER_EMAIL（所有者登录邮箱）}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?请在 .env 设置 OWNER_PASSWORD（所有者登录密码）}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  web:
    build:
      context: ./web
    environment:
      DATABASE_URL: postgresql://job_assistant:${POSTGRES_PASSWORD}@db:5432/job_assistant?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?请在 .env 设置 BETTER_AUTH_SECRET}
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      AI_KEY_ENCRYPTION_KEY: ${AI_KEY_ENCRYPTION_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_OAUTH_REDIRECT_URI: ${FEISHU_OAUTH_REDIRECT_URI:-}
      FEISHU_TOKEN_ENCRYPTION_KEY: ${FEISHU_TOKEN_ENCRYPTION_KEY:-}
      FEISHU_AUTO_SYNC_ENABLED: ${FEISHU_AUTO_SYNC_ENABLED:-true}
      RESUME_CHROMIUM_PATH: ${RESUME_CHROMIUM_PATH:-}
    ports:
      - "3000:3000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
