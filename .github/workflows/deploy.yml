name: build-and-push-web

on:
  push:
    branches:
      - main
  # 手动重建一次镜像。部署不在这里做。
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-web

concurrency:
  group: build-web
  cancel-in-progress: false

# 这个工作流只负责"构建镜像并推到 ghcr"。
#
# 上线由服务器自己完成：/root/watch-deploy.sh 每 2 分钟检查一次 ghcr 上 :latest 的镜像 ID，
# 变了就 git pull + force-recreate web（crontab 装的，见 docs/deploy.md「推送即部署」）。
#
# 2026-10-24 试过让这里 SSH 进服务器部署，配了受限私钥 + 三个 secret，但服务器始终拒绝
# CI 出示的那把 key（客户端侧 -v 日志确认 key 正确送达），而 host/user 又被 GitHub
# 在日志里打码，排查成本远高于收益。服务器轮询不需要任何凭据，就不再启用了。
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
